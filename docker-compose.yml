services:
  hub:
    build: .
    ports:
      - "8765:8765"
    environment:
      - NETWORK_MODE=public
      - WS_PORT=8765
      - WS_SECRET=${WS_SECRET:-dev-secret}
      - LOOM_AUTH_SECRET=${LOOM_AUTH_SECRET:-loom-auth-dev}
      - LOOM_MASTER_KEY=${LOOM_MASTER_KEY:-loom-dev-master}
    volumes:
      - ./plugins:/app/plugins
    restart: unless-stopped

  mcp-demo:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: pip install fastapi uvicorn && python scripts/mock_mcp_server.py
    ports:
      - "3900:3900"
    profiles: ["demo"]
