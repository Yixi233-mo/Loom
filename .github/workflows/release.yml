name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r requirements.txt
      - run: npm install
      - run: python scripts/lint_all.py
      - run: python scripts/test_all.py

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: loom-hub:${{ github.ref_name }}

  windows-msi:
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Build MSI + NSIS
        run: python scripts/build_windows.py
      - name: Upload Windows installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-bundle/*.msi
            dist-bundle/*.exe
          generate_release_notes: true

  release:
    needs: [build-test, windows-msi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build:single
      - name: Upload app.html to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app.html
          generate_release_notes: true
