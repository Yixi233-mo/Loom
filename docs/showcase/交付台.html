<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f1ea" />
  <title>Loom 交付台</title>
  <style>
    :root {
      --bg: #f7f1ea;
      --glow: rgba(243, 215, 196, 0.95);
      --panel: rgba(255, 252, 248, 0.78);
      --panel-solid: #fffcf8;
      --ink: #2a221c;
      --muted: #7a6b60;
      --line: rgba(42, 34, 28, 0.1);
      --accent: #d9895b;
      --accent-strong: #c56d42;
      --accent-soft: #f6e2d4;
      --sage: #5f7f6a;
      --sage-soft: #e4efe7;
      --champagne: #efe2c8;
      --warn: #c4785a;
      --danger: #b85c4a;
      --shadow: 0 10px 32px rgba(120, 72, 40, 0.1);
      --r: 18px;
      --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80vw 60vh at 20% 0%, var(--glow), transparent 65%),
        var(--bg);
      line-height: 1.55;
      min-height: 100%;
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    }

    .phone {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100%;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 24px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark {
      width: 46px; height: 46px; border-radius: 14px;
      display: grid; place-items: center;
      background: linear-gradient(145deg, var(--accent), var(--accent-strong));
      color: #fffaf5; font-weight: 700; font-size: 20px;
      box-shadow: var(--shadow); flex-shrink: 0;
    }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: 0.02em; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .pill {
      flex-shrink: 0;
      padding: 6px 10px; border-radius: 999px;
      background: var(--champagne); color: var(--accent-strong);
      font-size: 11px; font-weight: 700;
      border: 1px solid rgba(197, 109, 66, 0.25);
    }

    .hero {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 14px;
    }
    .hero h2 { margin: 0 0 8px; font-size: 22px; line-height: 1.3; }
    .hero p { margin: 0; color: var(--muted); font-size: 13px; }
    .verdict {
      margin-top: 12px; padding: 12px; border-radius: 12px;
      background: var(--sage-soft); color: var(--sage);
      font-size: 13px; font-weight: 600;
      border: 1px solid rgba(95, 127, 106, 0.25);
    }

    .tabs {
      display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto;
      padding-bottom: 2px;
    }
    .tab {
      border: 1px solid var(--line); background: var(--panel);
      color: var(--ink); border-radius: 999px;
      padding: 8px 14px; font-size: 13px; font-weight: 650;
      cursor: pointer; white-space: nowrap;
    }
    .tab.is-on {
      background: var(--accent); border-color: transparent; color: #fffaf5;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 12px;
    }
    .card-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 10px; margin-bottom: 8px;
    }
    .card h3 { margin: 0; font-size: 16px; }
    .who { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
    .badge {
      font-size: 11px; font-weight: 700; padding: 4px 8px;
      border-radius: 999px; white-space: nowrap;
    }
    .badge.ok { background: var(--sage-soft); color: var(--sage); }
    .badge.wip { background: var(--champagne); color: var(--accent-strong); }
    .badge.todo { background: rgba(207, 198, 189, 0.35); color: var(--muted); }
    .form {
      margin: 10px 0 0; padding: 10px 12px; border-radius: 12px;
      background: color-mix(in srgb, var(--panel-solid) 70%, transparent);
      border: 1px dashed var(--line);
    }
    .form strong { display: block; font-size: 12px; margin-bottom: 4px; color: var(--accent-strong); }
    .form span { font-size: 13px; color: var(--ink); }
    .meta { display: grid; gap: 6px; margin-top: 10px; }
    .row {
      display: flex; gap: 8px; font-size: 12px;
    }
    .row b { color: var(--muted); font-weight: 600; min-width: 42px; }
    .row span { flex: 1; word-break: break-all; }
    code {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px; background: var(--accent-soft);
      padding: 1px 5px; border-radius: 6px;
    }
    pre {
      margin: 10px 0 0; padding: 12px; border-radius: 12px;
      background: #2a221c; color: #f7ece3; overflow-x: auto;
      font-size: 11px; line-height: 1.5;
    }

    .hidden { display: none !important; }

    .tabbar {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      width: min(400px, calc(100% - 24px));
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      padding: 8px;
    }
    .navbtn {
      border: none; background: transparent; border-radius: 16px;
      padding: 10px 4px; font-size: 11px; font-weight: 700;
      color: var(--muted); cursor: pointer;
    }
    .navbtn.is-on {
      background: var(--accent-soft); color: var(--accent-strong);
    }

    .sheet {
      position: fixed; inset: 0; z-index: 20; display: none;
    }
    .sheet.open { display: block; }
    .sheet-mask {
      position: absolute; inset: 0;
      background: rgba(42, 34, 28, 0.28);
    }
    .sheet-panel {
      position: absolute; left: 0; right: 0; bottom: 0;
      max-width: 430px; margin: 0 auto;
      background: var(--panel-solid);
      border-radius: 22px 22px 0 0;
      border-top: 1px solid var(--line);
      padding: 18px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      box-shadow: var(--shadow);
    }
    .sheet-panel h3 { margin: 0 0 8px; }
    .sheet-panel p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    .btn {
      width: 100%; border: none; border-radius: 999px;
      padding: 12px; font-weight: 700; font-size: 14px;
      background: var(--accent); color: #fffaf5; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="phone">
    <header class="top">
      <div class="brand">
        <div class="mark">织</div>
        <div>
          <h1>Loom 交付台</h1>
          <p>Delivery Kit · 手机可试</p>
        </div>
      </div>
      <span class="pill">开发中 0.1.0</span>
    </header>

    <section class="hero">
      <h2>最后这样交付吗？</h2>
      <p>是 —— 按「谁用什么」拆成五件套：Hub 一条命令、用户装 Shell、DSL 即插即用、配置交给部署者。</p>
      <div class="verdict">✓ 交付矩阵成立。缺口只在 Windows .msi / Android .apk 的打包流水线。</div>
    </section>

    <div class="tabs" id="filters">
      <button class="tab is-on" data-f="all">全部</button>
      <button class="tab" data-f="ready">已就绪</button>
      <button class="tab" data-f="wip">待打包</button>
      <button class="tab" data-f="todo">待补齐</button>
    </div>

    <div id="list"></div>
  </div>

  <nav class="tabbar">
    <button class="navbtn is-on" data-nav="kit">交付物</button>
    <button class="navbtn" data-nav="install">安装</button>
    <button class="navbtn" data-nav="status">现状</button>
  </nav>

  <div class="sheet" id="sheet">
    <div class="sheet-mask" id="sheetMask"></div>
    <div class="sheet-panel">
      <h3 id="sheetTitle">详情</h3>
      <p id="sheetBody"></p>
      <pre id="sheetCode"></pre>
      <button class="btn" id="sheetClose">知道了</button>
    </div>
  </div>

  <script>
    const items = [
      {
        id: "hub",
        name: "Hub",
        form: "Docker 镜像 / 单文件可执行",
        who: "部署者（你/团队管理员）",
        install: "docker run 一条命令",
        status: "ready",
        statusText: "Docker 已就绪",
        pack: "Dockerfile + docker-compose",
        cmd: "docker compose up hub\n# 或 npm run start:hub",
        note: "REST + WebSocket :8765。单文件 exe 可后续用 PyInstaller 收口，非本轮必须。",
      },
      {
        id: "win",
        name: "Shell · Windows",
        form: ".msi 安装包",
        who: "每个用户",
        install: "双击安装",
        status: "wip",
        statusText: "待打包 msi",
        pack: "Tauri 2 bundler（NSIS/MSI）",
        cmd: "cd src-tauri\n# 配置 tauri.conf.json bundle 目标后\ncargo tauri build",
        note: "壳与命令层已可 cargo run；正式 .msi 需本机 WiX/管理员权限跑一次打包。",
      },
      {
        id: "apk",
        name: "Shell · Android",
        form: ".apk 安装包",
        who: "每个用户",
        install: "侧载 / 应用商店",
        status: "todo",
        statusText: "待配置移动目标",
        pack: "Tauri 2 mobile / Android SDK",
        cmd: "npm run tauri android init\nnpm run tauri android build -- --apk",
        note: "UI 已做安全区/手势/软键盘适配；打包链与签名待配置（ROADMAP 遗留）。",
      },
      {
        id: "dsl",
        name: "DSL 模板",
        form: ".yaml 文件包",
        who: "每个用户",
        install: "放进 plugins/ 目录",
        status: "ready",
        statusText: "示例包已带",
        pack: "plugins/example/workflows/*.yaml",
        cmd: "cp -r plugins/example plugins/my-pack\n# 保存 yaml ≈2s 热加载",
        note: "Workflow / Plugin / Agent / Trigger 四类，保存前 Schema 校验。",
      },
      {
        id: "env",
        name: "配置",
        form: ".env / config.yaml",
        who: "部署者",
        install: "手动填写",
        status: "ready",
        statusText: "变量已约定",
        pack: "WS_SECRET · LOOM_AUTH_SECRET · LOOM_MASTER_KEY",
        cmd: "export WS_SECRET=...\nexport LOOM_AUTH_SECRET=...\nexport LOOM_MASTER_KEY=...",
        note: "禁止写进仓库；LLM Key 走加密存储，示例用 DeepSeek URL。",
      },
    ];

    const installGuide = [
      {
        name: "部署者 · 10 分钟上线",
        who: "管理员",
        install: "Docker + .env",
        status: "ready",
        statusText: "可执行",
        form: "Hub + 配置",
        pack: "docker-compose.yml",
        cmd: "cp .env.example .env  # 填密钥\ndocker compose up hub\n# 可选演示 MCP：npm run mcp:demo",
        note: "健康检查 GET /health。公网部署时改 NETWORK_MODE 与密钥。",
      },
      {
        name: "用户 · 桌面",
        who: "每个用户",
        install: "安装 .msi 后打开",
        status: "wip",
        statusText: "等 msi",
        form: "Windows 安装包",
        pack: "Loom-Setup.msi（规划）",
        cmd: "双击 msi → 完成 → 启动 Loom\n开发期：npm run dev + cargo run",
        note: "首次启动指向 Hub 地址即可连跨端。",
      },
      {
        name: "用户 · 手机",
        who: "每个用户",
        install: "侧载 apk 或商店",
        status: "todo",
        statusText: "等 apk",
        form: "Android 安装包",
        pack: "Loom.apk（规划）",
        cmd: "adb install Loom.apk\n# 开发预览：手机浏览器开 http://<PC-IP>:5173/",
        note: "侧载需允许「未知来源」；商店上架后续补。",
      },
    ];

    const statusBoard = [
      {
        name: "测试",
        who: "CI / 本地",
        install: "一条命令",
        status: "ready",
        statusText: "全绿",
        form: "自动化验收",
        pack: "test:ui + test:py + lint + build",
        cmd: "npm run test\nnpm run lint\nnpm run build",
        note: "FE.1–FE.7 已交付；Python 296 + 前端链 + Rust 命令层。",
      },
      {
        name: "文档",
        who: "协作与交接",
        install: "仓库内阅读",
        status: "ready",
        statusText: "已齐",
        form: "交付说明",
        pack: "目录/FE7_交付清单.md 等",
        cmd: "README.md\n目录/FE7_交付清单.md\n目录/FE5_三端验证步骤.md",
        note: "架构 / 开发 / 构建部署 / 验证步骤。",
      },
      {
        name: "人工三端点验",
        who: "你",
        install: "按步骤点一遍",
        status: "wip",
        statusText: "待勾选",
        form: "验收清单",
        pack: "目录/FE5_三端验证步骤.md",
        cmd: "Web 断点与分享\nWin 窗口/托盘/拖拽\n移动安全区/手势/返回",
        note: "自动化已覆盖逻辑；真机窗口与 apk 需人工确认。",
      },
    ];

    let filter = "all";
    let nav = "kit";

    function badge(s) {
      const map = { ready: ["ok", "已就绪"], wip: ["wip", "待打包"], todo: ["todo", "待补齐"] };
      const [cls, label] = map[s] || map.todo;
      return '<span class="badge ' + cls + '">' + label + "</span>";
    }

    function render() {
      const source =
        nav === "kit" ? items : nav === "install" ? installGuide : statusBoard;
      const list = document.getElementById("list");
      const rows = source.filter(function (it) {
        return filter === "all" || it.status === filter;
      });
      list.innerHTML = rows
        .map(function (it) {
          return (
            '<article class="card" data-id="' +
            it.id +
            '">' +
            '<div class="card-head"><div><h3>' +
            it.name +
            '</h3><p class="who">' +
            it.who +
            "</p></div>" +
            badge(it.status) +
            "</div>" +
            '<div class="form"><strong>' +
            (it.statusText || "形态") +
            "</strong><span>" +
            it.form +
            "</span></div>" +
            '<div class="meta">' +
            '<div class="row"><b>安装</b><span>' +
            it.install +
            "</span></div>" +
            '<div class="row"><b>打包</b><span>' +
            it.pack +
            "</span></div>" +
            "</div>" +
            '<pre>' +
            it.cmd.replace(/</g, "&lt;") +
            "</pre>" +
            "</article>"
          );
        })
        .join("");
    }

    document.getElementById("filters").addEventListener("click", function (ev) {
      const t = ev.target.closest(".tab");
      if (!t) return;
      filter = t.getAttribute("data-f");
      document.querySelectorAll(".tab").forEach(function (el) {
        el.classList.toggle("is-on", el === t);
      });
      render();
    });

    document.querySelector(".tabbar").addEventListener("click", function (ev) {
      const t = ev.target.closest(".navbtn");
      if (!t) return;
      nav = t.getAttribute("data-nav");
      document.querySelectorAll(".navbtn").forEach(function (el) {
        el.classList.toggle("is-on", el === t);
      });
      render();
    });

    document.getElementById("list").addEventListener("click", function (ev) {
      const card = ev.target.closest(".card");
      if (!card) return;
      const source =
        nav === "kit" ? items : nav === "install" ? installGuide : statusBoard;
      const it = source.find(function (x) {
        return x.name === card.querySelector("h3").textContent;
      });
      if (!it) return;
      document.getElementById("sheetTitle").textContent = it.name;
      document.getElementById("sheetBody").textContent = it.note || "";
      document.getElementById("sheetCode").textContent = it.cmd || "";
      document.getElementById("sheet").classList.add("open");
    });

    function closeSheet() {
      document.getElementById("sheet").classList.remove("open");
    }
    document.getElementById("sheetClose").addEventListener("click", closeSheet);
    document.getElementById("sheetMask").addEventListener("click", closeSheet);

    render();
  </script>
</body>
</html>
