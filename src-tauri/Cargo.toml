[package]
name = "loom_shell"
version = "0.1.0"
description = "Loom Shell — Tauri 2.0 三端壳 + 插件加载器"
edition = "2021"
default-run = "loom-shell-app"

[lib]
name = "loom_shell"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "loom-shell-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["wry"] }
