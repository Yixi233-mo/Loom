[package]
name = "loom_shell"
version = "0.1.0"
description = "Loom — 你的 AI 总控台（Tauri 2.0 三端壳）"
edition = "2021"
default-run = "loom-shell-app"

[lib]
name = "loom_shell"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "loom-shell-app"
path = "src/main.rs"

[features]
# 生产包必须开：用包内 dist，而不是 devUrl=localhost:5173
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["wry"] }
